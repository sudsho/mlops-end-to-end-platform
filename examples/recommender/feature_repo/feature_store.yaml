project: recommender
provider: local
registry:
    registry_type: sql
    path: postgresql://feast:feast@postgres:5432/feast_registry
online_store:
    type: redis
    connection_string: "redis:6379"
offline_store:
    type: postgres
    host: postgres
    port: 5432
    database: feast_offline
    db_schema: public
    user: feast
    password: feast
entity_key_serialization_version: 3
